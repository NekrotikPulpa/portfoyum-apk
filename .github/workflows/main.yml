name: Android APK Derle (Jsoup + Portfoyum Pro)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Zip Kontrolu
        run: |
          if [ -f "Portfoyum_Android_GitHub.zip" ] && [ ! -d "app" ]; then
            unzip -o Portfoyum_Android_GitHub.zip
          fi

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7 Kur ve APK Derle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          arguments: assembleDebug

      - name: Hazir APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Portfoyum-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
