name: Android APK Derle (Jsoup + Portfoyum Pro)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Proje Dosyalarini Ac
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
            fi
          done
          if [ ! -f "settings.gradle.kts" ]; then
            sub=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
            if [ -n "$sub" ]; then
              cp -r "$(dirname "$sub")"/* .
            fi
          fi

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.7 Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Android APK Derle
        run: gradle assembleDebug

      - name: Hazir APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Portfoyum-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
